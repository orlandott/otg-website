name: Weekly blog post

on:
  schedule:
    # Tuesdays 13:00 UTC = 9:00 AM ET (8:00 AM during EST)
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      mock:
        description: "Use mock fixture instead of calling the Claude API"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: node automation/blog/generate.mjs ${{ inputs.mock && '--mock' || '' }}

      - name: Verify site builds with the new post
        run: npm run build

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG=$(cat automation/out/blog/slug.txt)
          BRANCH="auto/blog-${SLUG}"
          DATE=$(date -u +%Y-%m-%d)

          git config user.name "otg-automation"
          git config user.email "noreply@orlandotgroupinc.com"
          git checkout -b "$BRANCH"
          git add src/lib/data/generated-posts.json src/lib/data/generated-post-meta.json automation/state.json
          git commit -m "Add weekly blog post: ${SLUG}"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Weekly blog post (${DATE}): ${SLUG}" \
            --body-file automation/out/blog/pr-body.md \
            --base main \
            --head "$BRANCH"
