name: Weekly blog post

on:
  schedule:
    # Tuesdays 13:00 UTC = 9:00 AM ET (8:00 AM during EST)
    - cron: "0 13 * * 2"
  workflow_dispatch:
    inputs:
      mock:
        description: "Use mock fixture instead of calling the Claude API"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The publish step rebases onto origin/main, which needs real history
          # rather than the default depth-1 checkout.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: node automation/blog/generate.mjs ${{ inputs.mock && '--mock' || '' }}

      - name: Verify site builds with the new post
        run: npm run build

      - name: Read publish decision
        id: decision
        run: |
          set -euo pipefail
          node -e 'const d = require("./automation/out/blog/publish-decision.json");
                   console.log(`slug=${d.slug}\nauto=${d.autoPublish}`)' >> "$GITHUB_OUTPUT"

      - name: Commit the post
        run: |
          set -euo pipefail
          git config user.name "otg-automation"
          git config user.email "noreply@orlandotgroupinc.com"
          git add src/lib/data/generated-posts.json \
                  src/lib/data/generated-post-meta.json \
                  automation/state.json
          git commit -m "Add weekly blog post: ${{ steps.decision.outputs.slug }}"

      # Cloudflare Pages watches main via its own GitHub App, so landing the
      # commit here is what actually publishes the post. The owner is emailed
      # from inside this step so the mail only goes out once the push lands.
      - name: Publish to main and tell the owner
        if: steps.decision.outputs.auto == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not push to main after 3 attempts."
              exit 1
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 10))
          done
          echo "Published ${{ steps.decision.outputs.slug }} to main."
          node automation/notify.mjs \
            "OTG blog: new post published" \
            automation/out/blog/summary.txt

      # Compliance blockers, a flipped kill switch, or a mock run land here instead.
      - name: Open a review PR and tell the owner
        if: steps.decision.outputs.auto != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          set -euo pipefail
          BRANCH="auto/blog-${{ steps.decision.outputs.slug }}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Weekly blog post needs review: ${{ steps.decision.outputs.slug }}" \
            --body-file automation/out/blog/pr-body.md \
            --base main \
            --head "$BRANCH"
          node automation/notify.mjs \
            "OTG blog: post held for review" \
            automation/out/blog/pr-body.md

      # generate.mjs emails its own failures, so this covers every step after it
      # — including the build, which otherwise would have failed silently.
      - name: Email the owner if publishing failed
        if: failure() && steps.generate.outcome == 'success'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          cat > /tmp/publish-failure.txt <<EOF
          The weekly blog post was written but could not be published.

          Slug: ${{ steps.decision.outputs.slug }}
          Run:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The post is not live. Re-run: GitHub -> Actions -> Weekly blog post -> Run workflow.
          EOF
          node automation/notify.mjs "OTG blog automation failed to publish" /tmp/publish-failure.txt
