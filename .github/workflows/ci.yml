name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Deterministic, secret-free check on the weekly blog post the scheduled
      # routine commits — see docs/weekly-blog-post.md.
      - name: Validate blog posts
        run: npm run validate:blog

      # A mock run needs no secrets, so this only checks that the preflight
      # itself still loads and runs — it never depends on repository secrets.
      - name: Check social preflight
        run: node automation/social/preflight.mjs --mock

      - name: Build
        run: npm run build
